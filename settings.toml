# Job watcher settings
# Edit this file on GitHub (pencil icon), then click "Commit changes".
# Text between quotes is not case-sensitive.

# A job matches if its title CONTAINS any of these.
include_titles = [
  "product designer",
  "ux designer",
  "ui designer",
  "ux/ui",
  "ui/ux",
  "product design lead",
  "lead designer",
  "designer, product",
  "product design",
  "ux design",
  "ui design",
  "experience designer",
  "interaction designer",
  "design systems designer",
  "design lead",
  "designer, ux",
  "designer, ui",
]

# A job is skipped if its title has any of these words.
# Remove "manager" or "director" if you want design management roles too.
exclude_titles = [
  "intern",
  "internship",
  "junior",
  "associate",
  "contract",
  "contractor",
  "freelance",
  "industrial",
  "graphic",
  "brand",
  "marketing",
  "motion",
  "learning",
  "instructional",
  "manager",
  "director",
]

# Only remote roles? (true or false)
require_remote = true

# Only roles open to people in the United States? (true or false)
require_us = true

# Also allow roles open to Brazil (listed as Brazil, Brasil, São Paulo, LATAM...)?
# Only used when require_us = true. The role still has to be fully remote.
allow_brazil = true

# Skip roles posted more than this many days ago (0 = no limit).
# Roles with no posting date at all are still emailed.
max_age_days = 30

# Some listings just say "Remote" without naming a country.
# true = email them to you anyway, with a note to double-check.
# false = skip them.
include_unclear_location = true

# LinkedIn searches shown at the top of every alert email.
# Each one opens LinkedIn jobs posted in the last hour, newest first,
# using the remote and US settings above. Add or remove phrases as you like.
linkedin_searches = [
  "product designer",
  "ux designer",
]

# Built In link: only roles updated in the last N days (1 = past 24 hours, 3 = last 3 days).
builtin_days = 1

# Show a Wellfound Product Designer link in the alert email? (true or false)
wellfound = true
