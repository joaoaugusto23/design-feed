name: Company finder

on:
  schedule:
    - cron: "0 7 * * 0"   # Sundays, 7:00 UTC
  workflow_dispatch:       # adds a "Run workflow" button

permissions:
  contents: write

concurrency:
  group: company-finder
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find companies
        run: python discover.py

      - name: Save the list
        run: |
          git config user.name "job-watcher"
          git config user.email "job-watcher@users.noreply.github.com"
          git add discovered.txt
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update automatically found companies"
            git pull --rebase
            git push
          fi
