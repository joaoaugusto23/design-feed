name: Job watcher

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:          # adds a "Run workflow" button for manual runs

permissions:
  contents: write             # lets it save which jobs it has already seen

concurrency:
  group: job-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for new roles
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python watcher.py

      - name: Remember what was seen
        run: |
          git config user.name "job-watcher"
          git config user.email "job-watcher@users.noreply.github.com"
          git add seen.json status.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update seen jobs"
            git pull --rebase
            git push
          fi
